name: Daily News Clipping

on:
  schedule:
    - cron: "0 23 * * *" # 매일 08:00 KST
  workflow_dispatch:
    inputs:
      days:
        description: "최근 N일 이내 기사 수집"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run news clipper
        run: python -m news_clipper.cli --days "${{ github.event.inputs.days || '1' }}"

      - name: Commit digest if changed
        run: |
          git config user.name "news-clipper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add clippings/
          git diff --cached --quiet || git commit -m "chore: 뉴스 클리핑 $(date +%F)"
          git push
